<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ร้านน้ำชงน้องน้ำ</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#3d2b1f;--brand-light:#8a6f5c;
  --accent:#ff9540;--accent-dark:#e2711d;
  --teal:#0fb5a3;--teal-dark:#0a8f81;
  --bg:#fff8f0;--card:#fff;--line:#f1e4d6;
  --danger:#ef4444;--success:#16a34a;
  --shadow-sm:0 2px 8px rgba(61,43,31,.06);
  --shadow-md:0 8px 24px rgba(61,43,31,.10);
  --radius:18px
}
body{font-family:'Prompt','Noto Sans Thai',sans-serif;background:var(--bg);color:var(--brand);padding-bottom:110px;font-size:15.5px;min-height:100vh}
header{background:linear-gradient(135deg,#ff9a4c,#e2531f);color:#fff;padding:24px 18px 30px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:13px}
.logo-img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;background:#fff}
.title{font-size:20.5px;font-weight:800}.sub{font-size:12.5px;opacity:.92}
#cartIconBtn{position:relative;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);width:44px;height:44px;border-radius:50%;font-size:20px;color:#fff}
#cartIconBadge{position:absolute;top:-5px;right:-5px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:none;align-items:center;justify-content:center;padding:0 5px}
#status{margin:14px 16px 0;padding:13px 15px;border-radius:14px;font-size:14px;font-weight:500}.loading{background:#fff3e6;color:#a5690b}.error{background:#fdecec;color:var(--danger)}
main{padding:16px}.section-title{font-size:16px;font-weight:800;margin:18px 0 12px}
.menu-grid{display:flex;flex-direction:column;gap:12px}
.menu-card{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px}
.menu-card img{width:66px;height:66px;object-fit:cover;border-radius:14px;background:var(--line)}
.info{flex:1;min-width:0}.name{font-weight:700;font-size:16.5px}.price{color:var(--accent-dark);font-weight:700;font-size:14.5px}
.add-btn{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border:0;padding:10px 18px;border-radius:22px;font-size:14.5px;font-weight:700}
.soldout{background:#eee!important;color:#999!important;cursor:not-allowed}
#cartBar{position:fixed;left:14px;right:14px;bottom:14px;background:#3d2b1f;color:#fff;padding:14px 18px;display:none;align-items:center;justify-content:space-between;border-radius:20px}
#cartBar button{background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;border:0;padding:11px 22px;border-radius:22px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(30,20,12,.5);display:none;align-items:flex-end;z-index:50}.overlay.show{display:flex}
.sheet{background:#fff;width:100%;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px}
.sheet-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}.sheet-head img{width:62px;height:62px;border-radius:16px;object-fit:cover}.close-x{margin-left:auto;background:#f4ece2;border:0;width:34px;height:34px;border-radius:50%}
.option-group{margin:18px 0}.option-label{font-weight:700;font-size:14px;margin-bottom:9px}
.chip-row{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:9px 16px;font-size:14.5px;cursor:pointer}
.chip.selected{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:var(--accent-dark);color:#fff;font-weight:700}
.qty-row{display:flex;align-items:center;justify-content:center;gap:20px;margin:20px 0 6px}
.qty-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#faf6f0;font-size:18px;font-weight:700}
.sheet-add-btn,#confirmBtn{width:100%;padding:15px;margin-top:16px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border:0;border-radius:16px;font-size:15.5px;font-weight:800}
.field-label{display:block;font-size:14px;color:#6b5a48;margin:14px 0 6px;font-weight:700}
input[type=text],input[type=tel]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15.5px;background:#fbf8f4}
</style>
</head>
<body>
<header>
  <img src="logo.png" class="logo-img" alt="โลโก้ร้าน" onerror="this.src='https://via.placeholder.com/54'">
  <div><div class="title">ร้านน้ำชงน้องน้ำ</div><div class="sub">เลือกเมนู กดสั่งได้เลยค่ะ</div></div>
  <button id="cartIconBtn" onclick="openCart()">🛒<span id="cartIconBadge">0</span></button>
</header>

<div id="status" class="loading">กำลังโหลด...</div>

<main id="menuSection" style="display:none">
  <h3 class="section-title">เมนูเครื่องดื่ม</h3>
  <div class="menu-grid" id="menuList"></div>
</main>

<div id="cartBar"><div><span id="cartCount">0</span> รายการ · <b><span id="cartTotal">0</span> บาท</b></div><button onclick="openCart()">ดูตะกร้า</button></div>

<div class="overlay" id="itemOverlay"><div class="sheet">
<div class="sheet-head"><img id="mImg"><div><div class="name" id="mName"></div><div class="price" id="mPrice"></div></div><button class="close-x" onclick="closeItemModal()">✕</button></div>
<div class="option-group"><div class="option-label">รูปแบบเครื่องดื่ม</div><div class="chip-row" id="drinkTypeChips"></div></div>
<div class="option-group"><div class="option-label">บรรจุภัณฑ์</div><div class="chip-row" id="containerChips"></div></div>
<div class="option-group"><div class="option-label">ระดับความหวาน</div><div class="chip-row" id="sweetnessChips"></div></div>
<div class="option-group"><div class="option-label">จำนวน</div><div class="qty-row"><button class="qty-btn" onclick="changeQty(-1)">−</button><div class="qty-num" id="qtyNum">1</div><button class="qty-btn" onclick="changeQty(1)">+</button></div></div>
<button class="sheet-add-btn" onclick="addSelectionToCart()">เพิ่มลงตะกร้า · <span id="itemTotalPrice">0</span> บาท</button>
</div></div>

<div class="overlay" id="cartOverlay"><div class="sheet">
<div class="sheet-head"><div class="name">ตะกร้าสินค้า</div><button class="close-x" onclick="closeCart()">✕</button></div>
<div id="cartLines"></div>
<div style="display:flex;justify-content:space-between;font-weight:800;margin:18px 0 8px"><span>ยอดรวม</span><span><span id="cartModalTotal">0</span> บาท</span></div>
<label class="field-label">ชื่อผู้รับ *</label><input type="text" id="custName" placeholder="ชื่อ-นามสกุล">
<label class="field-label">เบอร์โทรศัพท์ *</label><input type="tel" id="custTel" placeholder="0812345678">
<button id="confirmBtn" onclick="confirmOrder()">ยืนยันคำสั่งซื้อ</button>
</div></div>

<script>
// ตั้งค่าชี้ไปที่ IP คอมพิวเตอร์ของคุณ (XAMPP)
const API_URL = 'http://192.168.1.170/nongnam/api.php';
const LIFF_ID = '2011058922-zZ7LXynR';
const SWEETNESS_OPTIONS = ['ปกติ','หวานน้อย','หวานมาก','ไม่หวาน'];
const DRINK_TYPE_OPTIONS = [{value:'เย็น',label:'🧊 เย็น'},{value:'ปั่น',label:'🥤 ปั่น'},{value:'ร้อน',label:'🔥 ร้อน'}];
const CONTAINER_OPTIONS = [{value:'แก้ว',label:'🥤 แก้ว'},{value:'ถุง',label:'🛍️ ถุง'}];
let cart=[], profile=null, currentItem=null, currentDrinkType='', currentContainer='', currentSweetness=SWEETNESS_OPTIONS[0], currentQty=1;

function setStatus(text, type){ const e=document.getElementById('status'); e.textContent=text; e.className=type||''; e.style.display=text?'block':'none'; }

async function init(){
  try{
    setStatus('กำลังเชื่อมต่อ LINE...','loading');
    await liff.init({liffId: LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login(); return; }
    profile = await liff.getProfile();
    await loadMenu();
  }catch(err){
    profile = { userId: 'GUEST_USER', displayName: 'ลูกค้าทดสอบ' };
    await loadMenu();
  }
}

async function loadMenu(){
  try{
    setStatus('กำลังโหลดเมนู...','loading');
    const res = await fetch(API_URL + '?action=getMenu', {cache:'no-store'});
    const json = await res.json();
    if(!json.ok) throw new Error(json.error);
    const menu = json.data.menu || [];
    document.getElementById('menuList').innerHTML = menu.map(m => {
      const ok = !m.status || m.status === 'available';
      return `<div class="menu-card">
        ${m.img ? `<img src="${m.img}">` : ''}
        <div class="info"><div class="name">${m.name}</div><div class="price">${m.price} บาท</div></div>
        ${ok ? `<button class="add-btn" onclick='openItemModal(${JSON.stringify(m)})'>เลือก</button>` : `<button class="add-btn soldout" disabled>หมด</button>`}
      </div>`;
    }).join('');
    document.getElementById('menuSection').style.display = 'block';
    setStatus('','');
  }catch(err){ setStatus('โหลดเมนูไม่สำเร็จ: ' + err.message, 'error'); }
}

function openItemModal(item){
  currentItem = item; currentDrinkType = 'เย็น'; currentContainer = 'แก้ว'; currentSweetness = SWEETNESS_OPTIONS[0]; currentQty = 1;
  document.getElementById('mImg').src = item.img || ''; document.getElementById('mName').textContent = item.name; document.getElementById('mPrice').textContent = item.price + ' บาท';
  document.getElementById('drinkTypeChips').innerHTML = DRINK_TYPE_OPTIONS.map(o => `<div class="chip ${o.value==='เย็น'?'selected':''}" onclick="currentDrinkType='${o.value}'">${o.label}</div>`).join('');
  document.getElementById('containerChips').innerHTML = CONTAINER_OPTIONS.map(o => `<div class="chip ${o.value==='แก้ว'?'selected':''}" onclick="currentContainer='${o.value}'">${o.label}</div>`).join('');
  document.getElementById('sweetnessChips').innerHTML = SWEETNESS_OPTIONS.map(s => `<div class="chip ${s===currentSweetness?'selected':''}" onclick="currentSweetness='${s}'">${s}</div>`).join('');
  document.getElementById('qtyNum').textContent = 1; updateItemTotalDisplay();
  document.getElementById('itemOverlay').classList.add('show');
}

function closeItemModal(){ document.getElementById('itemOverlay').classList.remove('show'); }
function changeQty(d){ currentQty = Math.max(1, currentQty + d); document.getElementById('qtyNum').textContent = currentQty; updateItemTotalDisplay(); }
function updateItemTotalDisplay(){ document.getElementById('itemTotalPrice').textContent = Number(currentItem.price||0) * currentQty; }

function addSelectionToCart(){
  const unitPrice = Number(currentItem.price||0);
  cart.push({ id: currentItem.id, name: currentItem.name, drinkType: currentDrinkType, container: currentContainer, sweetness: currentSweetness, qty: currentQty, unitPrice, subtotal: unitPrice * currentQty });
  closeItemModal(); renderCartBar();
}

function cartTotal(){ return cart.reduce((s,c) => s + c.subtotal, 0); }

function renderCartBar(){
  const count = cart.reduce((s,c) => s + c.qty, 0);
  document.getElementById('cartIconBadge').textContent = count;
  document.getElementById('cartIconBadge').style.display = count > 0 ? 'flex' : 'none';
  if(!cart.length){ document.getElementById('cartBar').style.display = 'none'; return; }
  document.getElementById('cartBar').style.display = 'flex';
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = cartTotal();
}

function openCart(){
  document.getElementById('cartLines').innerHTML = cart.map((c,i) => `<div><b>${c.name} x${c.qty}</b> (${c.drinkType}, ${c.container}, ${c.sweetness}) - ${c.subtotal} บาท</div>`).join('');
  document.getElementById('cartModalTotal').textContent = cartTotal();
  document.getElementById('cartOverlay').classList.add('show');
}
function closeCart(){ document.getElementById('cartOverlay').classList.remove('show'); }

async function confirmOrder(){
  const name = document.getElementById('custName').value.trim();
  const tel = document.getElementById('custTel').value.trim();
  if(!name || !tel) return alert('กรุณากรอกข้อมูลให้ครบ');
  
  const btn = document.getElementById('confirmBtn'); btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  try{
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'createOrder', userId: profile ? profile.userId : '', name, telephone: tel, items: cart, totalPrice: cartTotal() }) });
    const j = await res.json(); if(!j.ok) throw new Error(j.error);
    alert('สั่งซื้อสำเร็จ! 🎉'); cart = []; closeCart(); renderCartBar();
    if(liff.closeWindow) liff.closeWindow();
  }catch(e){ alert('เกิดข้อผิดพลาด: ' + e.message); }
  finally{ btn.disabled = false; btn.textContent = 'ยืนยันคำสั่งซื้อ'; }
}

init();
</script>
</body>
</html>
